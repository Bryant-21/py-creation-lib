[package]
name = "nif_core_native"
version = "0.1.0"
edition = "2024"

[lib]
name = "nif_core_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1.5"
havok_native = { path = "../havok" }
materials_native = { path = "../materials" }
indexmap = "2"
kiddo = "5"
once_cell = "1"
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }

[build-dependencies]
roxmltree = "0.20"

[dev-dependencies]
tempfile = { workspace = true }
