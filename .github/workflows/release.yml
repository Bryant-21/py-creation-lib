name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: uv build --wheel
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist/*.whl -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw "no wheel found (uv build --wheel produced nothing)" }
          gh release create "v${{ needs.gate.outputs.version }}" --target ${{ github.sha }} --title "v${{ needs.gate.outputs.version }}" --generate-notes $files
