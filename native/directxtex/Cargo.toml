[package]
name = "directxtex_native"
version = "0.1.0"
edition = "2024"

[lib]
name = "directxtex_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags = "2.4.2"
intel_tex_2 = "0.5.0"
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }
winresult = "0.1.3"

[dev-dependencies]
rayon = "1"

[build-dependencies]
cc = "1.0.83"
